<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="100%" height="100%">
  <defs>
    <linearGradient id="velmoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="velmoraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Monogram Icon -->
  <g transform="translate(6, 10)">
    <polygon points="12,0 24,38 0,38" fill="url(#velmoraGrad)" opacity="0.9" />
    <polygon points="12,8 20,38 4,38" fill="#0F172A" />
    <circle cx="12" cy="18" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Clean Geometric Brandmark Typography -->
  <text x="46" y="38" 
        font-family="'Montserrat', sans-serif" 
        font-size="31" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#0F172A">
    VELMORA
  </text>
  
  <!-- Subtle Haute Mark -->
  <circle cx="258" cy="18" r="3" fill="#2563EB" />
</svg>
